name: macOS build
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['GoogleCalendarDom.json', 'macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['GoogleCalendarDom.json', 'macos/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and test model
        run: |
          python3 -m pip install -r macos/requirements.txt
          cd macos
          python3 -m unittest discover -v -s . -p 'test_*.py'
      - name: Exercise native UI with synthetic data
        run: python3 macos/main.py --smoke-test
        env:
          CALENDAR_WIDGET_QA_DIR: macos/build/qa
      - name: Build and verify app bundle
        run: bash macos/build.sh
      - name: Check bundled CLI and application startup
        run: |
          python3 macos/check_bundle.py
          'macos/dist/Team Calendar Widget.app/Contents/MacOS/GoogleCalendarWidget' --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCalendarWidget-mac-${{ matrix.arch }}
          path: |
            dist/*mac-*.zip
            dist/SHA256SUMS-mac-*.txt
            macos/build/qa/*.png
