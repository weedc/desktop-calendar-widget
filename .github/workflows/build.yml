name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile native widget
        shell: pwsh
        run: ./build.ps1
      - name: Run isolated self-checks
        run: python tests/run_self_checks.py
      - name: Package portable application
        shell: pwsh
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DesktopCalendarWidget-win-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
